<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brick Defense</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Brick Defense</h1>
    <canvas id="game" width="1000" height="600" aria-label="Block Breaker game"></canvas>
    <p>Move the paddle with the left and right arrow keys, or A and D.</p>
    <p>Don't let the bricks reach the bottom or you lose! Buy upgrades to get stronger.</p>
  </main>

  <!-- The order matters: game.js goes first because the other files use its settings. -->
  <script src="game.js"></script>
  <script src="bricks.js"></script>
  <script src="collisions.js"></script>
</body>
</html>

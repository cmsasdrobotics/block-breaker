<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brick Defense</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <canvas id="game" width="600" height="450" aria-label="Block Breaker game"></canvas>
    <header class="game-hud">
      <h1>Brick Defense</h1>
      <p>Move: Left / Right or A / D</p>
      <button id="fullscreen-button" type="button">Fullscreen</button>
    </header>
  </main>

  <!-- The order matters: game.js goes first because the other files use its settings. -->
  <script src="game.js"></script>
  <script src="components.js"></script>
  <script src="bricks.js"></script>
  <script src="collisions.js"></script>
</body>
</html>
